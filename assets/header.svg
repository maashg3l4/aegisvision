<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">AegisVision — safety-first routing for industrial steel surface inspection</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect width="1000" height="240" rx="14"/></clipPath>
  </defs>
  <style>
    .title { font: 700 62px "Inter","Segoe UI",-apple-system,Helvetica,Arial,sans-serif; letter-spacing: 1px; fill: url(#ttl); }
    .sub   { font: 400 17px "Inter","Segoe UI",-apple-system,Helvetica,Arial,sans-serif; fill: #94a3b8; letter-spacing: .4px; }
    .pill  { fill: none; stroke: #334155; stroke-width: 1.2; }
    .pt    { font: 600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill: #93c5fd; letter-spacing: 1.2px; text-anchor: middle; }
    .fade  { opacity: 0; animation: rise 1.1s ease-out forwards; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .5s; } .d3 { animation-delay: .9s; }
    .brk   { fill: none; stroke: #3b82f6; stroke-width: 2.5; stroke-linecap: round; animation: pulse 3.2s ease-in-out infinite; }
    @keyframes rise  { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .fade, .brk { animation: none; opacity: 1; } }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1000" height="240" fill="url(#bg)"/>
    <rect width="1000" height="240" fill="url(#grid)"/>

    <!-- scanning sweep -->
    <rect y="0" width="90" height="240" fill="url(#glow)">
      <animate attributeName="x" values="-90;1000" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect y="0" width="2" height="240" fill="#60a5fa" opacity=".8">
      <animate attributeName="x" values="-2;1088" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- inspection brackets -->
  <g class="brk">
    <path d="M232 52 H212 V72"/>
    <path d="M768 52 H788 V72"/>
    <path d="M232 168 H212 V148"/>
    <path d="M768 168 H788 V148"/>
  </g>

  <text class="title fade d1" x="500" y="112" text-anchor="middle">AegisVision</text>
  <text class="sub fade d2" x="500" y="146" text-anchor="middle">Safety-first routing for industrial steel surface inspection</text>

  <g class="fade d3">
    <g transform="translate(202,176)"><rect class="pill" width="70" height="26" rx="13"/><text class="pt" x="35" y="17">V3 POLICY</text></g>
    <g transform="translate(286,176)"><rect class="pill" width="100" height="26" rx="13"/><text class="pt" x="50" y="17">15-CLASS DATA</text></g>
    <g transform="translate(400,176)"><rect class="pill" width="120" height="26" rx="13"/><text class="pt" x="60" y="17">HUMAN REVIEW</text></g>
    <g transform="translate(534,176)"><rect class="pill" width="115" height="26" rx="13"/><text class="pt" x="57" y="17">OOD CHECK</text></g>
    <g transform="translate(663,176)"><rect class="pill" width="135" height="26" rx="13"/><text class="pt" x="67" y="17">REPORT ASSISTANT</text></g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
